name: Build Bypass IDE APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test & Build Debug/Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper & Signing Keystore
        run: |
          chmod +x ./gradlew
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback CI debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Prepare Google Services Config
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            if printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | grep -q '^[[:space:]]*{'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json
            fi
          else
            echo "app/google-services.json missing in repo; generating CI fallback config for APK build..."
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "project_id": "bypass-ide-ci-fallback",' \
              '    "storage_bucket": "bypass-ide-ci-fallback.firebasestorage.app"' \
              '  },' \
              '  "client": [' \
              '    {' \
              '      "client_info": {' \
              '        "mobilesdk_app_id": "1:000000000000:android:0000000000000000",' \
              '        "android_client_info": {' \
              '          "package_name": "com.aistudio.bypasside.mvqxrt"' \
              '        }' \
              '      },' \
              '      "oauth_client": [],' \
              '      "api_key": [' \
              '        {' \
              '          "current_key": "CI_FALLBACK_KEY_SET_IN_APP_SETTINGS"' \
              '        }' \
              '      ],' \
              '      "services": {' \
              '        "appinvite_service": {' \
              '          "other_platform_oauth_client": []' \
              '        }' \
              '      }' \
              '    }' \
              '  ],' \
              '  "configuration_version": "1"' \
              '}' > app/google-services.json
          fi
          ls -lh app/google-services.json

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Signed Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Package APKs & Generate Checksums
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated!"
            exit 1
          fi
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi

          cp "$DEBUG_APK" dist/BypassIDE-debug.apk
          cp "$RELEASE_APK" dist/BypassIDE-release.apk

          {
            echo "## Bypass IDE APK Build Summary"
            echo ""
            echo "| Artifact | Size | SHA-256 |"
            echo "| :--- | :--- | :--- |"
            echo "| \`BypassIDE-debug.apk\` | $(du -h dist/BypassIDE-debug.apk | cut -f1) | \`$(sha256sum dist/BypassIDE-debug.apk | cut -d' ' -f1)\` |"
            echo "| \`BypassIDE-release.apk\` | $(du -h dist/BypassIDE-release.apk | cut -f1) | \`$(sha256sum dist/BypassIDE-release.apk | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassIDE-debug-apk
          path: dist/BypassIDE-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassIDE-release-apk
          path: dist/BypassIDE-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Combined APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: BypassIDE-all-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bypass IDE {0}', github.ref_name) || 'Bypass IDE — Latest Build' }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/BypassIDE-debug.apk
            dist/BypassIDE-release.apk
